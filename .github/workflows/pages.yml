name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; the newest push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Not the emsdk container: the image ships cmake 3.22 and this project
      # needs 3.25, which the plain runner already has.
      - name: Cache emsdk
        id: emsdk
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-3.1.64

      - name: Install emsdk
        if: steps.emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git emsdk
          ./emsdk/emsdk install 3.1.64
          ./emsdk/emsdk activate 3.1.64

      - name: Build
        run: |
          source ./emsdk/emsdk_env.sh
          emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Release \
            -DGB_BUILD_WASM=ON \
            -DGB_BUILD_SDL3=OFF \
            -DGB_BUILD_HEADLESS=OFF \
            -DGB_BUILD_TESTS=OFF
          cmake --build build-wasm

      - name: Collect site
        run: |
          mkdir -p site
          cp build-wasm/src/frontend/wasm/index.html site/
          cp build-wasm/src/frontend/wasm/index.js site/
          cp build-wasm/src/frontend/wasm/index.wasm site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
